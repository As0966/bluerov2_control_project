# BlueROV2 Disturbance Configuration
# ====================================
# Used for robustness testing of controllers.
# Copied from the original ROS1 bluerov2_gazebo package.

disturbances:
  # Constant ocean current starting at t=5s
  -
    type: current
    starting_time: 5
    velocity: 0.5
    horizontal_angle: 0
    vertical_angle: 0
    duration: -1    # indefinite

  # External wrench pulse at t=100s (10s duration)
  -
    type: wrench
    starting_time: 100
    duration: 10
    force:
      - 500
      - 100
      - 0
    torque:
      - 0
      - 0
      - 0

  # Thruster 2 failure at t=60s (20s blackout)
  -
    type: thruster_state
    starting_time: 60
    duration: 20
    is_on: 0
    thruster_id: 2

  # Thruster 0 efficiency drop at t=120s
  -
    type: thrust_efficiency
    starting_time: 120
    duration: 30
    efficiency: 0.4
    thruster_id: 0

  # Propeller 7 efficiency drop at t=80s
  -
    type: propeller_efficiency
    starting_time: 80
    duration: 10
    efficiency: 0.7
    thruster_id: 7
